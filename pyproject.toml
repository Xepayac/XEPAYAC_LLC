[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgs"
version = "0.4.0"
description = "Superseding Graph Substrate - A graph-based framework for LLM orchestration"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Xepayac LLC", email = "xepayacllc@gmail.com"}
]
keywords = ["graph", "execution", "orchestration", "multi-agent", "substrate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Xepayac/XEPAYAC_LLC"
Repository = "https://github.com/Xepayac/XEPAYAC_LLC"
Documentation = "https://github.com/Xepayac/Xepayac_LLC#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
